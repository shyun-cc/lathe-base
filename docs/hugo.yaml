title: lathe-base 设计讨论稿
baseURL: https://shyun-cc.github.io/lathe-base/
defaultContentLanguage: zh
locale: zh-CN
hasCJKLanguage: true
enableRobotsTXT: true
timeZone: UTC
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false
outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]
params:
  description: 设计讨论稿；业务需求与实现尚未确定。
  offline_search: true
  copyright:
    authors: lathe-base contributors
    from_year: 2026
  ui:
    preset: paper
    dark_mode: true
    docs_section: design
    quick_links: [design]
    section_index: list
    sidebar_menu_foldable: true
module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.168.0
